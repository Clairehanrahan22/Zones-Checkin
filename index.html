<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zones of Regulation Check-In</title>
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: #f4f4f4; touch-action: none; }

    .screen { display: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
    .screen.active { display: flex; flex-direction: column; align-items: center; justify-content: center; }

    /* Card Layouts for Teacher / Class Screens */
    .card-grid { display: flex; justify-content: center; align-items: center; gap: 20px; flex-wrap: wrap; padding: 20px; max-width: 900px; }
    
    .card-btn { 
      position: relative; 
      width: 180px; 
      height: 110px; 
      background-color: #708090; 
      color: white; 
      border: none; 
      border-radius: 20px; 
      font-size: 20px; 
      font-weight: bold; 
      cursor: pointer; 
      box-shadow: 0 4px 10px rgba(0,0,0,0.2); 
      transition: transform 0.2s, background-color 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 10px;
    }
    .card-btn:hover { transform: scale(1.05); }
    .card-btn.add-btn { background-color: #2e7d32; }

    .screen-title { font-size: 28px; margin-bottom: 20px; color: #333; font-weight: bold; }

    /* Board Screen */
    #board-screen { display: none; width: 100vw; height: 100vh; position: relative; }
    .nav-bar { position: absolute; top: 15px; left: 15px; z-index: 100; display: flex; gap: 15px; }
    .icon-btn { width: 45px; height: 45px; border-radius: 50%; background: #ffffff; border: 2px solid #ccc; font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

    /* Top Action Bars */
    .top-right-bar { position: absolute; top: 15px; right: 15px; z-index: 100; display: flex; gap: 10px; }
    .top-left-bar { position: absolute; top: 15px; left: 15px; z-index: 100; display: flex; gap: 10px; }

    /* Parking Lot */
    #parking-lot { 
      width: 20%; 
      height: 100vh; 
      background-color: #ebebeb; 
      border-right: 3px solid #ccc; 
      float: left; 
      position: relative; 
      padding-top: 80px; 
      padding-left: 10px;
      padding-right: 10px;
      display: flex; 
      flex-wrap: wrap; 
      align-content: flex-start;
      justify-content: center;
      gap: 20px 10px; 
      overflow-y: auto; 
      z-index: 20; 
      touch-action: pan-y;
      -webkit-overflow-scrolling: touch;
    }
    
    /* Zones Board */
    #zones-container { 
      width: 80%; 
      height: 100vh; 
      float: right; 
      display: flex; 
      background-image: url('Zones-pics.jpg'); 
      background-size: 100% 100%; 
      background-position: center; 
      background-repeat: no-repeat;
      position: relative;
    }

    .zone { flex: 1; height: 100%; border-left: 2px solid rgba(0,0,0,0.1); display: flex; flex-direction: column; }
    .zone-body { flex: 1; position: relative; }

    /* Student Avatars */
    .student-avatar { 
      width: 80px; 
      height: 80px; 
      border-radius: 50%; 
      position: relative; 
      cursor: grab; 
      border: 3px solid #fff; 
      box-shadow: 0 4px 8px rgba(0,0,0,0.25); 
      z-index: 50; 
      touch-action: none; 
      flex-shrink: 0;
      background-color: #ffffff;
      overflow: visible;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .student-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      pointer-events: none;
    }

    .student-name { 
      position: absolute; 
      bottom: -8px; 
      left: 50%; 
      transform: translateX(-50%); 
      background-color: white; 
      color: black; 
      font-size: 11px; 
      font-weight: bold; 
      padding: 2px 6px; 
      border-radius: 8px; 
      border: 1px solid #ccc; 
      white-space: nowrap; 
      z-index: 10;
    }

    .delete-btn { 
      display: none; 
      position: absolute; 
      top: -5px; 
      right: -5px; 
      width: 22px; 
      height: 22px; 
      background-color: #ff3b30; 
      color: white; 
      border-radius: 50%; 
      font-size: 14px; 
      line-height: 20px; 
      text-align: center; 
      cursor: pointer; 
      font-weight: bold; 
      z-index: 20;
    }
    
    .edit-mode .delete-btn { display: block; }
    #image-input { display: none; }

    .sync-status {
      position: absolute;
      top: 70px;
      left: 15px;
      font-size: 12px;
      color: #666;
      padding: 5px 10px;
      background: rgba(255,255,255,0.9);
      border-radius: 4px;
      z-index: 100;
    }
  </style>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

  <!-- Teacher Selection Screen -->
  <div id="teacher-screen" class="screen active">
    <div class="top-right-bar">
      <button class="icon-btn" onclick="toggleTeacherEditMode()">✏️</button>
    </div>
    <div class="screen-title">Select Teacher</div>
    <div class="card-grid" id="teacher-grid"></div>
  </div>

  <!-- Class Selection Screen -->
  <div id="home-screen" class="screen">
    <div class="top-left-bar">
      <button class="icon-btn" onclick="goTeacherSelect()">←</button>
    </div>
    <div class="top-right-bar">
      <button class="icon-btn" onclick="toggleClassEditMode()">✏️</button>
    </div>
    <div class="screen-title" id="class-screen-title">Classes</div>
    <div class="card-grid" id="class-grid"></div>
  </div>

  <!-- Board Screen -->
  <div id="board-screen" class="screen">
    <div class="nav-bar">
      <button class="icon-btn" onclick="goHome()">←</button>
      <button class="icon-btn" id="add-student-btn" style="display:none;" onclick="triggerFileInput()">+</button>
      <button class="icon-btn" onclick="toggleEditMode()">✏️</button>
    </div>
    <div class="sync-status" id="sync-status">Loading...</div>

    <input type="file" id="image-input" accept="image/*" onchange="handleAddStudent(event)">
    <div id="parking-lot"></div>

    <div id="zones-container">
      <div class="zone"><div class="zone-body"></div></div>
      <div class="zone"><div class="zone-body"></div></div>
      <div class="zone"><div class="zone-body"></div></div>
      <div class="zone"><div class="zone-body"></div></div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDrdoikBD-0sOK9tSxLWXGyDTNCzNR5Z6g",
      authDomain: "zones-checkin-12e9e.firebaseapp.com",
      projectId: "zones-checkin-12e9e",
      storageBucket: "zones-checkin-12e9e.firebasestorage.app",
      messagingSenderId: "3567533753",
      appId: "1:3567533753:web:2d9e010cfee33f17dca568"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let currentTeacher = null;
    let currentClass = null;
    let isEditMode = false;
    let isTeacherEditMode = false;
    let isClassEditMode = false;
    let draggedElement = null;
    let offsetTop = 0, offsetLeft = 0;
    let studentsData = [];
    let unsubscribeListener = null;

    function updateSyncStatus(message) {
      const el = document.getElementById('sync-status');
      if (el) el.textContent = message;
    }

    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => {
        s.classList.remove('active');
        s.style.display = 'none';
      });
      const target = document.getElementById(screenId);
      if (target) {
        target.classList.add('active');
        target.style.display = (screenId === 'board-screen') ? 'block' : 'flex';
      }
    }

    // Teacher Management
    function loadTeachers() {
      showScreen('teacher-screen');
      db.collection('teachers').onSnapshot(snapshot => {
        const grid = document.getElementById('teacher-grid');
        grid.innerHTML = '';
        
        let teachers = [];
        snapshot.forEach(doc => teachers.push({ id: doc.id, ...doc.data() }));

        if (teachers.length === 0) {
          db.collection('teachers').doc('Default Teacher').set({ name: 'Default Teacher' });
          return;
        }

        teachers.forEach(t => {
          const btn = document.createElement('button');
          btn.className = 'card-btn';
          btn.textContent = t.name;
          btn.onclick = () => selectTeacher(t.name);

          if (isTeacherEditMode) {
            const delBtn = document.createElement('div');
            delBtn.className = 'delete-btn';
            delBtn.style.display = 'block';
            delBtn.innerHTML = '×';
            delBtn.onclick = (e) => { e.stopPropagation(); deleteTeacher(t.id); };
            btn.appendChild(delBtn);
          }

          grid.appendChild(btn);
        });

        const addBtn = document.createElement('button');
        addBtn.className = 'card-btn add-btn';
        addBtn.textContent = '+ Add Teacher';
        addBtn.onclick = addTeacher;
        grid.appendChild(addBtn);
      });
    }

    function toggleTeacherEditMode() {
      isTeacherEditMode = !isTeacherEditMode;
      loadTeachers();
    }

    function addTeacher() {
      const name = prompt("Enter teacher name:");
      if (name && name.trim()) {
        db.collection('teachers').doc(name.trim()).set({ name: name.trim() });
      }
    }

    function deleteTeacher(id) {
      if (confirm(`Delete teacher "${id}" and all associated classes?`)) {
        db.collection('teachers').doc(id).delete();
      }
    }

    function selectTeacher(teacherName) {
      currentTeacher = teacherName;
      document.getElementById('class-screen-title').textContent = `${currentTeacher}'s Classes`;
      loadClasses();
    }

    function goTeacherSelect() {
      currentTeacher = null;
      loadTeachers();
    }

    // Class Management
    function loadClasses() {
      showScreen('home-screen');
      db.collection('teachers').doc(currentTeacher).collection('classes').onSnapshot(snapshot => {
        const grid = document.getElementById('class-grid');
        grid.innerHTML = '';

        let classes = [];
        snapshot.forEach(doc => classes.push({ id: doc.id, ...doc.data() }));

        if (classes.length === 0 && snapshot.empty) {
          const defaults = ['1st Hour', '3rd Hour', '5th Hour', 'Homeroom'];
          defaults.forEach(c => db.collection('teachers').doc(currentTeacher).collection('classes').doc(c).set({ name: c }));
          return;
        }

        classes.forEach(c => {
          const btn = document.createElement('button');
          btn.className = 'card-btn';
          btn.textContent = c.name;
          btn.onclick = () => openClass(c.name);

          if (isClassEditMode) {
            const delBtn = document.createElement('div');
            delBtn.className = 'delete-btn';
            delBtn.style.display = 'block';
            delBtn.innerHTML = '×';
            delBtn.onclick = (e) => { e.stopPropagation(); deleteClass(c.id); };
            btn.appendChild(delBtn);
          }

          grid.appendChild(btn);
        });

        const addBtn = document.createElement('button');
        addBtn.className = 'card-btn add-btn';
        addBtn.textContent = '+ Add Class';
        addBtn.onclick = addClass;
        grid.appendChild(addBtn);
      });
    }

    function toggleClassEditMode() {
      isClassEditMode = !isClassEditMode;
      loadClasses();
    }

    function addClass() {
      const className = prompt("Enter class name:");
      if (className && className.trim()) {
        db.collection('teachers').doc(currentTeacher).collection('classes').doc(className.trim()).set({ name: className.trim() });
      }
    }

    function deleteClass(classId) {
      if (confirm(`Delete class "${classId}"?`)) {
        db.collection('teachers').doc(currentTeacher).collection('classes').doc(classId).delete();
      }
    }

    // Board Logic
    function resetClassToParkingLot(callback) {
      db.collection('teachers').doc(currentTeacher)
        .collection('classes').doc(currentClass)
        .collection('students').get().then(snapshot => {
          const batch = db.batch();
          snapshot.forEach(doc => {
            batch.update(doc.ref, { zone: 'parking-lot', x: null, y: null });
          });
          return batch.commit();
        }).then(() => {
          if (callback) callback();
        }).catch(err => {
          console.error("Error resetting class: ", err);
          if (callback) callback();
        });
    }

    function openClass(className) {
      currentClass = className;
      showScreen('board-screen');

      resetClassToParkingLot(() => {
        listenToClassData();
      });
    }

    function goHome() {
      if (unsubscribeListener) {
        unsubscribeListener();
        unsubscribeListener = null;
      }
      currentClass = null;
      if (isEditMode) toggleEditMode();
      loadClasses();
    }

    function toggleEditMode() {
      isEditMode = !isEditMode;
      document.getElementById('add-student-btn').style.display = isEditMode ? 'flex' : 'none';
      document.getElementById('board-screen').classList.toggle('edit-mode', isEditMode);
    }

    function triggerFileInput() { document.getElementById('image-input').click(); }

    function handleAddStudent(event) {
      const file = event.target.files[0];
      if (!file) return;
      const studentName = prompt("Enter student's name:");
      if (!studentName) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.src = e.target.result;
        img.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = 100;
          canvas.height = 100;
          const ctx = canvas.getContext('2d');

          const minDim = Math.min(img.width, img.height);
          const sx = (img.width - minDim) / 2;
          const sy = (img.height - minDim) / 2;

          ctx.drawImage(img, sx, sy, minDim, minDim, 0, 0, 100, 100);
          const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.65);

          const student = {
            id: Date.now().toString(),
            name: studentName,
            image: compressedDataUrl,
            zone: 'parking-lot',
            x: null,
            y: null,
            lastModified: new Date().toISOString()
          };

          db.collection('teachers').doc(currentTeacher)
            .collection('classes').doc(currentClass)
            .collection('students').doc(student.id).set(student)
            .catch(err => console.error('Failed to sync student to Firebase', err));
        };
      };
      reader.readAsDataURL(file);
      event.target.value = '';
    }

    function deleteStudent(id) {
      db.collection('teachers').doc(currentTeacher)
        .collection('classes').doc(currentClass)
        .collection('students').doc(id).delete()
        .catch(err => console.error('Failed to delete student from Firebase', err));
    }

    function listenToClassData() {
      if (unsubscribeListener) unsubscribeListener();

      unsubscribeListener = db.collection('teachers').doc(currentTeacher)
        .collection('classes').doc(currentClass)
        .collection('students')
        .onSnapshot(snapshot => {
          const liveStudents = [];
          snapshot.forEach(doc => {
            liveStudents.push({ id: doc.id, ...doc.data() });
          });

          studentsData = liveStudents;
          renderStudents();
          updateSyncStatus('Synced with Firebase');
        }, err => {
          console.error('Firebase listener error', err);
          updateSyncStatus('Error connecting to Firebase');
        });
    }

    function renderStudents() {
      const parkingLot = document.getElementById('parking-lot');
      parkingLot.innerHTML = '';
      document.querySelectorAll('.student-avatar:not(#parking-lot .student-avatar)').forEach(el => el.remove());

      studentsData.forEach(student => {
        const avatar = document.createElement('div');
        avatar.className = 'student-avatar';
        avatar.id = student.id;

        const img = document.createElement('img');
        img.className = 'student-img';
        img.src = student.image;
        avatar.appendChild(img);

        const nameTag = document.createElement('div');
        nameTag.className = 'student-name';
        nameTag.innerText = student.name;
        avatar.appendChild(nameTag);

        const delBtn = document.createElement('div');
        delBtn.className = 'delete-btn';
        delBtn.innerHTML = '×';
        delBtn.onclick = (e) => { e.stopPropagation(); deleteStudent(student.id); };
        avatar.appendChild(delBtn);

        avatar.onmousedown = dragStart;
        avatar.ontouchstart = dragStart;

        if (student.zone === 'parking-lot' || student.x === null) {
          avatar.style.position = 'relative';
          avatar.style.top = '0';
          avatar.style.left = '0';
          parkingLot.appendChild(avatar);
        } else {
          avatar.style.position = 'absolute';
          avatar.style.left = student.x + 'px';
          avatar.style.top = student.y + 'px';
          document.getElementById('board-screen').appendChild(avatar);
        }
      });
    }

    function dragStart(e) {
      if (isEditMode && e.target.classList.contains('delete-btn')) return;
      e.preventDefault();
      draggedElement = e.currentTarget;

      const clientX = e.type === 'touchstart' ? e.touches[0].clientX : e.clientX;
      const clientY = e.type === 'touchstart' ? e.touches[0].clientY : e.clientY;
      const rect = draggedElement.getBoundingClientRect();

      offsetLeft = clientX - rect.left;
      offsetTop = clientY - rect.top;

      document.getElementById('board-screen').appendChild(draggedElement);
      draggedElement.style.position = 'absolute';
      moveAt(clientX, clientY);

      document.onmousemove = elementDrag;
      document.ontouchmove = elementDrag;
      document.onmouseup = closeDragElement;
      document.ontouchend = closeDragElement;
    }

    function moveAt(clientX, clientY) {
      draggedElement.style.left = (clientX - offsetLeft) + 'px';
      draggedElement.style.top = (clientY - offsetTop) + 'px';
    }

    function elementDrag(e) {
      const clientX = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
      const clientY = e.type === 'touchmove' ? e.touches[0].clientY : e.clientY;
      moveAt(clientX, clientY);
    }

    function closeDragElement(e) {
      document.onmousemove = null;
      document.ontouchmove = null;
      document.onmouseup = null;
      document.ontouchend = null;

      if (!draggedElement) return;

      const clientX = e.type === 'touchend' ? e.changedTouches[0].clientX : e.clientX;
      const clientY = e.type === 'touchend' ? e.changedTouches[0].clientY : e.clientY;

      const parkingLot = document.getElementById('parking-lot');
      const parkingRect = parkingLot.getBoundingClientRect();

      let zone = 'board';
      let x = parseInt(draggedElement.style.left, 10);
      let y = parseInt(draggedElement.style.top, 10);

      if (clientX >= parkingRect.left && clientX <= parkingRect.right &&
          clientY >= parkingRect.top && clientY <= parkingRect.bottom) {
        zone = 'parking-lot';
        x = null;
        y = null;
      }

      const student = studentsData.find(s => s.id === draggedElement.id);
      if (student) {
        student.zone = zone;
        student.x = x;
        student.y = y;
        student.lastModified = new Date().toISOString();

        db.collection('teachers').doc(currentTeacher)
          .collection('classes').doc(currentClass)
          .collection('students').doc(student.id).update({ zone, x, y })
          .catch(err => console.error('Failed to update student position in Firebase', err));
      }

      draggedElement = null;
    }

    loadTeachers();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(err => {
        console.error('Service worker registration failed', err);
      });
    }
  </script>
</body>
</html>
