<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zones of Regulation Check-In</title>
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: #f4f4f4; touch-action: none; }

    .screen { display: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
    .screen.active { display: flex; flex-direction: column; align-items: center; justify-content: center; }

    /* Card Layouts */
    .card-grid { display: flex; justify-content: center; align-items: center; gap: 20px; flex-wrap: wrap; padding: 20px; max-width: 900px; }
    
    .card-btn { 
      position: relative; 
      width: 180px; 
      height: 110px; 
      background-color: #708090; 
      color: white; 
      border: none; 
      border-radius: 20px; 
      font-size: 20px; 
      font-weight: bold; 
      cursor: pointer; 
      box-shadow: 0 4px 10px rgba(0,0,0,0.2); 
      transition: transform 0.2s, background-color 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 10px;
      user-select: none;
    }
    .card-btn:hover { transform: scale(1.05); }
    .card-btn.add-btn { background-color: #2e7d32; }
    .card-btn.dragging { opacity: 0.4; border: 2px dashed #fff; }

    .screen-title-container { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
    .screen-title { font-size: 28px; color: #333; font-weight: bold; }
    .edit-title-btn { 
      display: none; 
      background: #007aff; 
      color: white; 
      border: none; 
      border-radius: 50%; 
      width: 32px; 
      height: 32px; 
      font-size: 16px; 
      cursor: pointer; 
      align-items: center; 
      justify-content: center; 
    }

    /* Board Screen */
    #board-screen { display: none; width: 100vw; height: 100vh; position: relative; }
    .nav-bar { position: absolute; top: 15px; left: 15px; z-index: 100; display: flex; gap: 15px; }
    .icon-btn { width: 45px; height: 45px; border-radius: 50%; background: #ffffff; border: 2px solid #ccc; font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

    /* Action Bars */
    .top-right-bar { position: absolute; top: 15px; right: 15px; z-index: 100; display: flex; gap: 10px; }
    .top-left-bar { position: absolute; top: 15px; left: 15px; z-index: 100; display: flex; gap: 10px; }

    /* Parking Lot */
    #parking-lot { 
      width: 20%; 
      height: 100vh; 
      background-color: #ebebeb; 
      border-right: 3px solid #ccc; 
      float: left; 
      position: relative; 
      padding-top: 80px; 
      padding-left: 10px;
      padding-right: 10px;
      display: flex; 
      flex-wrap: wrap; 
      align-content: flex-start;
      justify-content: center;
      gap: 20px 10px; 
      overflow-y: auto; 
      z-index: 20; 
      touch-action: pan-y;
      -webkit-overflow-scrolling: touch;
    }
    
    /* Zones Board */
    #zones-container { 
      width: 80%; 
      height: 100vh; 
      float: right; 
      display: flex; 
      background-image: url('Zones-pics.jpg'); 
      background-size: 100% 100%; 
      background-position: center; 
      background-repeat: no-repeat;
      position: relative;
    }

    .zone { flex: 1; height: 100%; border-left: 2px solid rgba(0,0,0,0.1); display: flex; flex-direction: column; }
    .zone-body { flex: 1; position: relative; }

    /* Student Avatars */
    .student-avatar { 
      width: 80px; 
      height: 80px; 
      border-radius: 50%; 
      position: relative; 
      cursor: grab; 
      border: 3px solid #fff; 
      box-shadow: 0 4px 8px rgba(0,0,0,0.25); 
      z-index: 50; 
      touch-action: none; 
      flex-shrink: 0;
      background-color: #ffffff;
      overflow: visible;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .student-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      pointer-events: none;
    }

    .student-name { 
      position: absolute; 
      bottom: -8px; 
      left: 50%; 
      transform: translateX(-50%); 
      background-color: white; 
      color: black; 
      font-size: 11px; 
      font-weight: bold; 
      padding: 2px 6px; 
      border-radius: 8px; 
      border: 1px solid #ccc; 
      white-space: nowrap; 
      z-index: 10;
    }

    .delete-btn { 
      display: none; 
      position: absolute; 
      top: -5px; 
      right: -5px; 
      width: 22px; 
      height: 22px; 
      background-color: #ff3b30; 
      color: white; 
      border-radius: 50%; 
      font-size: 14px; 
      line-height: 20px; 
      text-align: center; 
      cursor: pointer; 
      font-weight: bold; 
      z-index: 20;
    }
    
    .edit-mode .delete-btn { display: block !important; }
    #image-input { display: none; }

    .sync-status {
      position: absolute;
      top: 70px;
      left: 15px;
      font-size: 12px;
      color: #666;
      padding: 5px 10px;
      background: rgba(255,255,255,0.9);
      border-radius: 4px;
      z-index: 100;
    }

    /* Modal Styling */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal-box {
      background: white;
      padding: 25px;
      border-radius: 12px;
      width: 320px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .modal-box h3 { margin-bottom: 15px; color: #333; }
    .modal-box input {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }
    .modal-actions { display: flex; gap: 10px; justify-content: center; }
    .modal-btn {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    .modal-btn.confirm { background-color: #2e7d32; color: white; }
    .modal-btn.cancel { background-color: #ccc; color: #333; }
  </style>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

  <!-- Teacher Selection Screen -->
  <div id="teacher-screen" class="screen active">
    <div class="top-right-bar">
      <button class="icon-btn" onclick="toggleTeacherEditMode()">✏️</button>
    </div>
    <div class="screen-title-container">
      <div class="screen-title">Select Teacher</div>
    </div>
    <div class="card-grid" id="teacher-grid"></div>
  </div>

  <!-- Class Selection Screen -->
  <div id="home-screen" class="screen">
    <div class="top-left-bar">
      <button class="icon-btn" onclick="goTeacherSelect()">←</button>
    </div>
    <div class="top-right-bar">
      <button class="icon-btn" onclick="toggleClassEditMode()">✏️</button>
    </div>
    <div class="screen-title-container">
      <div class="screen-title" id="class-screen-title">Classes</div>
      <button class="edit-title-btn" id="rename-teacher-btn" onclick="renameTeacherPrompt()">✏️</button>
    </div>
    <div class="card-grid" id="class-grid"></div>
  </div>

  <!-- Board Screen -->
  <div id="board-screen" class="screen">
    <div class="nav-bar">
      <button class="icon-btn" onclick="goHome()">←</button>
      <button class="icon-btn" id="add-student-btn" style="display:none;" onclick="triggerFileInput()">+</button>
      <button class="icon-btn" onclick="toggleEditMode()">✏️</button>
    </div>
    <div class="sync-status" id="sync-status">Loading...</div>

    <input type="file" id="image-input" accept="image/*" onchange="handleAddStudent(event)">
    <div id="parking-lot"></div>

    <div id="zones-container">
      <div class="zone"><div class="zone-body"></div></div>
      <div class="zone"><div class="zone-body"></div></div>
      <div class="zone"><div class="zone-body"></div></div>
      <div class="zone"><div class="zone-body"></div></div>
    </div>
  </div>

  <!-- Custom Input Modal -->
  <div class="modal-overlay" id="custom-modal">
    <div class="modal-box">
      <h3 id="modal-title">Enter Name</h3>
      <input type="text" id="modal-input" placeholder="Name...">
      <div class="modal-actions">
        <button class="modal-btn cancel" onclick="closeModal()">Cancel</button>
        <button class="modal-btn confirm" id="modal-confirm-btn">Save</button>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDrdoikBD-0sOK9tSxLWXGyDTNCzNR5Z6g",
      authDomain: "zones-checkin-12e9e.firebaseapp.com",
      projectId: "zones-checkin-12e9e",
      storageBucket: "zones-checkin-12e9e.firebasestorage.app",
      messagingSenderId: "3567533753",
      appId: "1:3567533753:web:2d9e010cfee33f17dca568"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let currentTeacher = null;
    let currentClass = null;
    let isEditMode = false;
    let isTeacherEditMode = false;
    let isClassEditMode = false;
    let draggedElement = null;
    let draggedCard = null;
    let offsetTop = 0, offsetLeft = 0;
    let studentsData = [];
    let unsubscribeListener = null;

    // Fallback Local Storage
    function getLocalTeachers() {
      return JSON.parse(localStorage.getItem('teachers') || '[]');
    }
    function saveLocalTeachers(list) {
      localStorage.setItem('teachers', JSON.stringify(list));
    }

    function getLocalClasses(teacher) {
      return JSON.parse(localStorage.getItem(`classes_${teacher}`) || '["1st Hour", "3rd Hour", "5th Hour", "Core", "Homeroom"]');
    }
    function saveLocalClasses(teacher, list) {
      localStorage.setItem(`classes_${teacher}`, JSON.stringify(list));
    }

    // Modal Dialog Helper
    function openModal(title, placeholder, defaultValue, onSave) {
      document.getElementById('modal-title').textContent = title;
      const input = document.getElementById('modal-input');
      input.value = defaultValue || '';
      input.placeholder = placeholder;
      document.getElementById('custom-modal').style.display = 'flex';
      input.focus();

      document.getElementById('modal-confirm-btn').onclick = () => {
        const val = input.value.trim();
        if (val) onSave(val);
        closeModal();
      };
    }
    function closeModal() {
      document.getElementById('custom-modal').style.display = 'none';
    }

    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => {
        s.classList.remove('active');
        s.style.display = 'none';
      });
      const target = document.getElementById(screenId);
      if (target) {
        target.classList.add('active');
        target.style.display = (screenId === 'board-screen') ? 'block' : 'flex';
      }
    }

    // Teacher Management
    function loadTeachers() {
      showScreen('teacher-screen');
      
      db.collection('teachers').onSnapshot(snapshot => {
        let teachers = [];
        snapshot.forEach(doc => teachers.push({ id: doc.id, name: doc.data().name || doc.id }));
        if (teachers.length === 0 && snapshot.empty) {
          teachers = [{ id: 'Claire', name: 'Claire' }];
          db.collection('teachers').doc('Claire').set({ name: 'Claire' }).catch(() => {});
        }
        saveLocalTeachers(teachers.map(t => t.name));
        renderTeacherGrid(teachers.map(t => t.name));
      }, err => {
        let local = getLocalTeachers();
        if (local.length === 0) local = ['Claire'];
        saveLocalTeachers(local);
        renderTeacherGrid(local);
      });
    }

    function renderTeacherGrid(teachers) {
      const grid = document.getElementById('teacher-grid');
      grid.innerHTML = '';

      teachers.forEach(tName => {
        const btn = document.createElement('button');
        btn.className = 'card-btn';
        btn.textContent = tName;
        btn.onclick = () => selectTeacher(tName);

        if (isTeacherEditMode) {
          const delBtn = document.createElement('div');
          delBtn.className = 'delete-btn';
          delBtn.style.display = 'block';
          delBtn.innerHTML = '×';
          delBtn.onclick = (e) => { e.stopPropagation(); deleteTeacher(tName); };
          btn.appendChild(delBtn);
        }

        grid.appendChild(btn);
      });

      const addBtn = document.createElement('button');
      addBtn.className = 'card-btn add-btn';
      addBtn.textContent = '+ Add Teacher';
      addBtn.onclick = addTeacherPrompt;
      grid.appendChild(addBtn);
    }

    function toggleTeacherEditMode() {
      isTeacherEditMode = !isTeacherEditMode;
      renderTeacherGrid(getLocalTeachers());
    }

    function addTeacherPrompt() {
      openModal("Add Teacher", "Teacher Name", "", (name) => {
        db.collection('teachers').doc(name).set({ name }).catch(() => {});
        let local = getLocalTeachers();
        if (!local.includes(name)) local.push(name);
        saveLocalTeachers(local);
        renderTeacherGrid(local);
      });
    }

    function renameTeacherPrompt() {
      openModal("Rename Profile", "Teacher Name", currentTeacher, (newName) => {
        if (newName === currentTeacher) return;
        
        const oldName = currentTeacher;
        // Update in DB
        db.collection('teachers').doc(oldName).delete().catch(() => {});
        db.collection('teachers').doc(newName).set({ name: newName }).catch(() => {});

        // Move local data
        let localTeachers = getLocalTeachers().map(t => t === oldName ? newName : t);
        saveLocalTeachers(localTeachers);
        let oldClasses = getLocalClasses(oldName);
        saveLocalClasses(newName, oldClasses);
        localStorage.removeItem(`classes_${oldName}`);

        currentTeacher = newName;
        document.getElementById('class-screen-title').textContent = `${currentTeacher}'s Classes`;
        loadClasses();
      });
    }

    function deleteTeacher(name) {
      if (confirm(`Delete teacher "${name}"?`)) {
        db.collection('teachers').doc(name).delete().catch(() => {});
        let local = getLocalTeachers().filter(t => t !== name);
        saveLocalTeachers(local);
        renderTeacherGrid(local);
      }
    }

    function selectTeacher(teacherName) {
      currentTeacher = teacherName;
      document.getElementById('class-screen-title').textContent = `${currentTeacher}'s Classes`;
      loadClasses();
    }

    function goTeacherSelect() {
      currentTeacher = null;
      if (isClassEditMode) toggleClassEditMode();
      loadTeachers();
    }

    // Class Management & Drag Reordering
    function loadClasses() {
      showScreen('home-screen');
      
      db.collection('teachers').doc(currentTeacher).collection('classes').orderBy('order', 'asc').onSnapshot(snapshot => {
        let classes = [];
        snapshot.forEach(doc => classes.push(doc.id));
        if (classes.length === 0 && snapshot.empty) {
          classes = getLocalClasses(currentTeacher);
          classes.forEach((c, idx) => db.collection('teachers').doc(currentTeacher).collection('classes').doc(c).set({ name: c, order: idx }).catch(() => {}));
        }
        saveLocalClasses(currentTeacher, classes);
        renderClassGrid(classes);
      }, err => {
        let local = getLocalClasses(currentTeacher);
        renderClassGrid(local);
      });
    }

    function renderClassGrid(classes) {
      const grid = document.getElementById('class-grid');
      grid.innerHTML = '';

      classes.forEach((cName, index) => {
        const btn = document.createElement('button');
        btn.className = 'card-btn';
        btn.textContent = cName;
        btn.dataset.className = cName;
        btn.dataset.index = index;
        btn.onclick = () => { if (!isClassEditMode) openClass(cName); };

        if (isClassEditMode) {
          btn.draggable = true;
          
          btn.ondragstart = (e) => {
            draggedCard = btn;
            btn.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
          };

          btn.ondragend = () => {
            btn.classList.remove('dragging');
            draggedCard = null;
            saveClassOrderFromDOM();
          };

          btn.ondragover = (e) => {
            e.preventDefault();
            if (draggedCard && draggedCard !== btn) {
              const allCards = [...grid.querySelectorAll('.card-btn:not(.add-btn)')];
              const draggedIdx = allCards.indexOf(draggedCard);
              const targetIdx = allCards.indexOf(btn);

              if (draggedIdx < targetIdx) {
                grid.insertBefore(draggedCard, btn.nextSibling);
              } else {
                grid.insertBefore(draggedCard, btn);
              }
            }
          };

          const delBtn = document.createElement('div');
          delBtn.className = 'delete-btn';
          delBtn.style.display = 'block';
          delBtn.innerHTML = '×';
          delBtn.onclick = (e) => { e.stopPropagation(); deleteClass(cName); };
          btn.appendChild(delBtn);
        }

        grid.appendChild(btn);
      });

      const addBtn = document.createElement('button');
      addBtn.className = 'card-btn add-btn';
      addBtn.textContent = '+ Add Class';
      addBtn.onclick = addClassPrompt;
      grid.appendChild(addBtn);
    }

    function saveClassOrderFromDOM() {
      const grid = document.getElementById('class-grid');
      const cards = grid.querySelectorAll('.card-btn:not(.add-btn)');
      const newOrder = [];

      cards.forEach((card, idx) => {
        const cName = card.dataset.className;
        newOrder.push(cName);
        db.collection('teachers').doc(currentTeacher).collection('classes').doc(cName).update({ order: idx }).catch(() => {});
      });

      saveLocalClasses(currentTeacher, newOrder);
    }

    function toggleClassEditMode() {
      isClassEditMode = !isClassEditMode;
      document.getElementById('rename-teacher-btn').style.display = isClassEditMode ? 'flex' : 'none';
      renderClassGrid(getLocalClasses(currentTeacher));
    }

    function addClassPrompt() {
      openModal("Add Class", "Class Name", "", (className) => {
        let local = getLocalClasses(currentTeacher);
        if (!local.includes(className)) {
          local.push(className);
          db.collection('teachers').doc(currentTeacher).collection('classes').doc(className).set({ name: className, order: local.length - 1 }).catch(() => {});
          saveLocalClasses(currentTeacher, local);
        }
        renderClassGrid(local);
      });
    }

    function deleteClass(classId) {
      if (confirm(`Delete class "${classId}"?`)) {
        db.collection('teachers').doc(currentTeacher).collection('classes').doc(classId).delete().catch(() => {});
        let local = getLocalClasses(currentTeacher).filter(c => c !== classId);
        saveLocalClasses(currentTeacher, local);
        renderClassGrid(local);
      }
    }

    // Board Logic
    function openClass(className) {
      currentClass = className;
      showScreen('board-screen');
      listenToClassData();
    }

    function goHome() {
      if (unsubscribeListener) {
        unsubscribeListener();
        unsubscribeListener = null;
      }
      currentClass = null;
      if (isEditMode) toggleEditMode();
      loadClasses();
    }

    function toggleEditMode() {
      isEditMode = !isEditMode;
      document.getElementById('add-student-btn').style.display = isEditMode ? 'flex' : 'none';
      document.getElementById('board-screen').classList.toggle('edit-mode', isEditMode);
    }

    function triggerFileInput() { document.getElementById('image-input').click(); }

    function handleAddStudent(event) {
      const file = event.target.files[0];
      if (!file) return;

      openModal("Add Student", "Student Name", "", (studentName) => {
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            canvas.width = 100;
            canvas.height = 100;
            const ctx = canvas.getContext('2d');

            const minDim = Math.min(img.width, img.height);
            const sx = (img.width - minDim) / 2;
            const sy = (img.height - minDim) / 2;

            ctx.drawImage(img, sx, sy, minDim, minDim, 0, 0, 100, 100);
            const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.65);

            const student = {
              id: Date.now().toString(),
              name: studentName,
              image: compressedDataUrl,
              zone: 'parking-lot',
              x: null,
              y: null
            };

            studentsData.push(student);
            renderStudents();

            db.collection('teachers').doc(currentTeacher)
              .collection('classes').doc(currentClass)
              .collection('students').doc(student.id).set(student).catch(() => {});
          };
        };
        reader.readAsDataURL(file);
      });
      event.target.value = '';
    }

    function deleteStudent(id) {
      studentsData = studentsData.filter(s => s.id !== id);
      renderStudents();

      db.collection('teachers').doc(currentTeacher)
        .collection('classes').doc(currentClass)
        .collection('students').doc(id).delete().catch(() => {});
    }

    function listenToClassData() {
      if (unsubscribeListener) unsubscribeListener();

      // Listen to new teacher profile student collection
      unsubscribeListener = db.collection('teachers').doc(currentTeacher)
        .collection('classes').doc(currentClass)
        .collection('students')
        .onSnapshot(snapshot => {
          const liveStudents = [];
          snapshot.forEach(doc => liveStudents.push({ id: doc.id, ...doc.data() }));

          // Auto-Import from legacy database path if new teacher collection is empty
          if (liveStudents.length === 0) {
            db.collection('classes').doc(currentClass).collection('students').get().then(legacySnap => {
              legacySnap.forEach(legacyDoc => {
                const s = { id: legacyDoc.id, ...legacyDoc.data() };
                liveStudents.push(s);
                // Copy over to new teacher collection
                db.collection('teachers').doc(currentTeacher)
                  .collection('classes').doc(currentClass)
                  .collection('students').doc(s.id).set(s).catch(() => {});
              });
              studentsData = liveStudents;
              renderStudents();
            }).catch(() => {
              studentsData = liveStudents;
              renderStudents();
            });
          } else {
            studentsData = liveStudents;
            renderStudents();
          }

          document.getElementById('sync-status').textContent = 'Synced';
        }, err => {
          renderStudents();
          document.getElementById('sync-status').textContent = 'Local Storage Mode';
        });
    }

    function renderStudents() {
      const parkingLot = document.getElementById('parking-lot');
      parkingLot.innerHTML = '';
      document.querySelectorAll('.student-avatar:not(#parking-lot .student-avatar)').forEach(el => el.remove());

      studentsData.forEach(student => {
        const avatar = document.createElement('div');
        avatar.className = 'student-avatar';
        avatar.id = student.id;

        const img = document.createElement('img');
        img.className = 'student-img';
        img.src = student.image;
        avatar.appendChild(img);

        const nameTag = document.createElement('div');
        nameTag.className = 'student-name';
        nameTag.innerText = student.name;
        avatar.appendChild(nameTag);

        const delBtn = document.createElement('div');
        delBtn.className = 'delete-btn';
        delBtn.innerHTML = '×';
        delBtn.onclick = (e) => { e.stopPropagation(); deleteStudent(student.id); };
        avatar.appendChild(delBtn);

        avatar.onmousedown = dragStart;
        avatar.ontouchstart = dragStart;

        if (student.zone === 'parking-lot' || student.x === null) {
          avatar.style.position = 'relative';
          avatar.style.top = '0';
          avatar.style.left = '0';
          parkingLot.appendChild(avatar);
        } else {
          avatar.style.position = 'absolute';
          avatar.style.left = student.x + 'px';
          avatar.style.top = student.y + 'px';
          document.getElementById('board-screen').appendChild(avatar);
        }
      });
    }

    function dragStart(e) {
      if (isEditMode && e.target.classList.contains('delete-btn')) return;
      e.preventDefault();
      draggedElement = e.currentTarget;

      const clientX = e.type === 'touchstart' ? e.touches[0].clientX : e.clientX;
      const clientY = e.type === 'touchstart' ? e.touches[0].clientY : e.clientY;
      const rect = draggedElement.getBoundingClientRect();

      offsetLeft = clientX - rect.left;
      offsetTop = clientY - rect.top;

      document.getElementById('board-screen').appendChild(draggedElement);
      draggedElement.style.position = 'absolute';
      moveAt(clientX, clientY);

      document.onmousemove = elementDrag;
      document.ontouchmove = elementDrag;
      document.onmouseup = closeDragElement;
      document.ontouchend = closeDragElement;
    }

    function moveAt(clientX, clientY) {
      draggedElement.style.left = (clientX - offsetLeft) + 'px';
      draggedElement.style.top = (clientY - offsetTop) + 'px';
    }

    function elementDrag(e) {
      const clientX = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
      const clientY = e.type === 'touchmove' ? e.touches[0].clientY : e.clientY;
      moveAt(clientX, clientY);
    }

    function closeDragElement(e) {
      document.onmousemove = null;
      document.ontouchmove = null;
      document.onmouseup = null;
      document.ontouchend = null;

      if (!draggedElement) return;

      const clientX = e.type === 'touchend' ? e.changedTouches[0].clientX : e.clientX;
      const clientY = e.type === 'touchend' ? e.changedTouches[0].clientY : e.clientY;

      const parkingLot = document.getElementById('parking-lot');
      const parkingRect = parkingLot.getBoundingClientRect();

      let zone = 'board';
      let x = parseInt(draggedElement.style.left, 10);
      let y = parseInt(draggedElement.style.top, 10);

      if (clientX >= parkingRect.left && clientX <= parkingRect.right &&
          clientY >= parkingRect.top && clientY <= parkingRect.bottom) {
        zone = 'parking-lot';
        x = null;
        y = null;
      }

      const student = studentsData.find(s => s.id === draggedElement.id);
      if (student) {
        student.zone = zone;
        student.x = x;
        student.y = y;

        db.collection('teachers').doc(currentTeacher)
          .collection('classes').doc(currentClass)
          .collection('students').doc(student.id).update({ zone, x, y }).catch(() => {});
      }

      draggedElement = null;
    }

    loadTeachers();
  </script>
</body>
</html>
