<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zones of Regulation Check-In</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: #f4f4f4; touch-action: none; }

    /* Home Screen */
    #home-screen { display: flex; justify-content: center; align-items: center; gap: 30px; height: 100vh; background-color: #ffffff; flex-wrap: wrap; padding: 20px; }
    .class-btn { width: 180px; height: 110px; background-color: #708090; color: white; border: none; border-radius: 50%; font-size: 22px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.15); transition: transform 0.2s; }
    .class-btn:hover { transform: scale(1.05); }

    /* Board Screen */
    #board-screen { display: none; width: 100vw; height: 100vh; position: relative; }
    .nav-bar { position: absolute; top: 15px; left: 15px; z-index: 100; display: flex; gap: 15px; }
    .icon-btn { width: 45px; height: 45px; border-radius: 50%; background: #e0e0e0; border: 2px solid #ccc; font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }

    /* Parking Lot & Zones */
    #parking-lot { width: 20%; height: 100vh; background-color: #ebebeb; border-right: 3px solid #ccc; float: left; position: relative; padding-top: 80px; display: flex; flex-direction: column; align-items: center; gap: 15px; overflow-y: auto; }
    #zones-container { width: 80%; height: 100vh; float: right; display: flex; }
    .zone { flex: 1; height: 100%; border-left: 2px solid #333; display: flex; flex-direction: column; }
    .zone-header { height: 60px; color: white; font-size: 24px; font-weight: bold; display: flex; align-items: center; justify-content: center; font-family: 'Georgia', serif; }
    .zone-body { flex: 1; position: relative; }

    .green .zone-header { background-color: #2e8b57; } .green .zone-body { background-color: #d4edda; }
    .yellow .zone-header { background-color: #ffa500; } .yellow .zone-body { background-color: #fff3cd; }
    .blue .zone-header { background-color: #4169e1; } .blue .zone-body { background-color: #d1ecf1; }
    .red .zone-header { background-color: #dc3545; } .red .zone-body { background-color: #f8d7da; }

    /* Student Avatars */
    .student-avatar { width: 75px; height: 75px; border-radius: 50%; position: relative; cursor: grab; background-size: cover; background-position: center; border: 3px solid #fff; box-shadow: 0 4px 8px rgba(0,0,0,0.25); z-index: 10; touch-action: none; }
    .student-name { position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%); background-color: white; color: black; font-size: 11px; font-weight: bold; padding: 2px 6px; border-radius: 8px; border: 1px solid #ccc; white-space: nowrap; }
    .delete-btn { display: none; position: absolute; top: -5px; right: -5px; width: 22px; height: 22px; background-color: #ff3b30; color: white; border-radius: 50%; font-size: 14px; line-height: 20px; text-align: center; cursor: pointer; font-weight: bold; }
    .edit-mode .delete-btn { display: block; }
    #image-input { display: none; }
  </style>

  <!-- Firebase Libraries -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

  <!-- Home Screen -->
  <div id="home-screen">
    <button class="class-btn" onclick="openClass('1st Hour')">1st<br>Hour</button>
    <button class="class-btn" onclick="openClass('3rd Hour')">3rd<br>Hour</button>
    <button class="class-btn" onclick="openClass('5th Hour')">5th<br>Hour</button>
    <button class="class-btn" onclick="openClass('Homeroom')">Homeroom</button>
  </div>

  <!-- Board Screen -->
  <div id="board-screen">
    <div class="nav-bar">
      <button class="icon-btn" onclick="goHome()">←</button>
      <button class="icon-btn" id="add-student-btn" style="display:none;" onclick="triggerFileInput()">+</button>
      <button class="icon-btn" onclick="toggleEditMode()">✏️</button>
    </div>

    <input type="file" id="image-input" accept="image/*" onchange="handleAddStudent(event)">
    <div id="parking-lot"></div>

    <div id="zones-container">
      <div class="zone green"><div class="zone-header">Green Zone</div><div class="zone-body"></div></div>
      <div class="zone yellow"><div class="zone-header">Yellow Zone</div><div class="zone-body"></div></div>
      <div class="zone blue"><div class="zone-header">Blue Zone</div><div class="zone-body"></div></div>
      <div class="zone red"><div class="zone-header">Red Zone</div><div class="zone-body"></div></div>
    </div>
  </div>

  <script>
    // --- YOUR EXACT FIREBASE KEYS INTEGRATED HERE ---
    const firebaseConfig = {
      apiKey: "AIzaSyDrdoikBD-0sOK9tSxLWXGyDTNCzNR5Z6g",
      authDomain: "zones-checkin-12e9e.firebaseapp.com",
      projectId: "zones-checkin-12e9e",
      storageBucket: "zones-checkin-12e9e.firebasestorage.app",
      messagingSenderId: "3567533753",
      appId: "1:3567533753:web:2d9e010cfee33f17dca568"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let currentClass = null;
    let isEditMode = false;
    let draggedElement = null;
    let offsetTop = 0, offsetLeft = 0;
    let studentsData = [];

    function openClass(className) {
      currentClass = className;
      document.getElementById('home-screen').style.display = 'none';
      document.getElementById('board-screen').style.display = 'block';
      listenToClassData();
    }

    function goHome() {
      currentClass = null;
      document.getElementById('board-screen').style.display = 'none';
      document.getElementById('home-screen').style.display = 'flex';
      if (isEditMode) toggleEditMode();
    }

    function toggleEditMode() {
      isEditMode = !isEditMode;
      document.getElementById('add-student-btn').style.display = isEditMode ? 'flex' : 'none';
      document.getElementById('board-screen').classList.toggle('edit-mode', isEditMode);
    }

    function triggerFileInput() { document.getElementById('image-input').click(); }

    function handleAddStudent(event) {
      const file = event.target.files[0];
      if (!file) return;
      const studentName = prompt("Enter student's name:");
      if (!studentName) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.src = e.target.result;
        img.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = 150; canvas.height = 150;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, 150, 150);
          
          const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.7);
          db.collection('classes').doc(currentClass).collection('students').add({
            name: studentName,
            image: compressedDataUrl,
            zone: 'parking-lot',
            x: null, y: null
          });
        };
      };
      reader.readAsDataURL(file);
      event.target.value = '';
    }

    function deleteStudent(id) {
      db.collection('classes').doc(currentClass).collection('students').doc(id).delete();
    }

    function listenToClassData() {
      db.collection('classes').doc(currentClass).collection('students')
        .onSnapshot(snapshot => {
          studentsData = [];
          snapshot.forEach(doc => studentsData.push({ id: doc.id, ...doc.data() }));
          renderStudents();
        });
    }

    function renderStudents() {
      const parkingLot = document.getElementById('parking-lot');
      parkingLot.innerHTML = '';
      
      document.querySelectorAll('.student-avatar:not(#parking-lot .student-avatar)').forEach(el => el.remove());

      studentsData.forEach(student => {
        const avatar = document.createElement('div');
        avatar.className = 'student-avatar';
        avatar.id = student.id;
        avatar.style.backgroundImage = `url(${student.image})`;

        const nameTag = document.createElement('div');
        nameTag.className = 'student-name';
        nameTag.innerText = student.name;
        avatar.appendChild(nameTag);

        const delBtn = document.createElement('div');
        delBtn.className = 'delete-btn';
        delBtn.innerHTML = '×';
        delBtn.onclick = (e) => { e.stopPropagation(); deleteStudent(student.id); };
        avatar.appendChild(delBtn);

        avatar.onmousedown = dragStart;
        avatar.ontouchstart = dragStart;

        if (student.zone === 'parking-lot' || student.x === null) {
          avatar.style.position = 'relative';
          avatar.style.top = '0'; avatar.style.left = '0';
          parkingLot.appendChild(avatar);
        } else {
          avatar.style.position = 'absolute';
          avatar.style.left = student.x + 'px';
          avatar.style.top = student.y + 'px';
          document.getElementById('board-screen').appendChild(avatar);
        }
      });
    }

    function dragStart(e) {
      if (isEditMode && e.target.classList.contains('delete-btn')) return;
      e.preventDefault();
      draggedElement = e.currentTarget;

      const clientX = e.type === 'touchstart' ? e.touches[0].clientX : e.clientX;
      const clientY = e.type === 'touchstart' ? e.touches[0].clientY : e.clientY;
      const rect = draggedElement.getBoundingClientRect();

      offsetLeft = clientX - rect.left;
      offsetTop = clientY - rect.top;

      document.getElementById('board-screen').appendChild(draggedElement);
      draggedElement.style.position = 'absolute';
      moveAt(clientX, clientY);

      document.onmousemove = elementDrag;
      document.ontouchmove = elementDrag;
      document.onmouseup = closeDragElement;
      document.ontouchend = closeDragElement;
    }

    function moveAt(clientX, clientY) {
      draggedElement.style.left = (clientX - offsetLeft) + 'px';
      draggedElement.style.top = (clientY - offsetTop) + 'px';
    }

    function elementDrag(e) {
      const clientX = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
      const clientY = e.type === 'touchmove' ? e.touches[0].clientY : e.clientY;
      moveAt(clientX, clientY);
    }

    function closeDragElement(e) {
      document.onmousemove = null; document.ontouchmove = null;
      document.onmouseup = null; document.ontouchend = null;

      if (!draggedElement) return;

      const clientX = e.type === 'touchend' ? e.changedTouches[0].clientX : e.clientX;
      const clientY = e.type === 'touchend' ? e.changedTouches[0].clientY : e.clientY;

      const parkingLot = document.getElementById('parking-lot');
      const parkingRect = parkingLot.getBoundingClientRect();

      let zone = 'board';
      let x = parseInt(draggedElement.style.left);
      let y = parseInt(draggedElement.style.top);

      if (clientX >= parkingRect.left && clientX <= parkingRect.right &&
          clientY >= parkingRect.top && clientY <= parkingRect.bottom) {
        zone = 'parking-lot';
        x = null; y = null;
      }

      db.collection('classes').doc(currentClass).collection('students').doc(draggedElement.id).update({ zone, x, y });
      draggedElement = null;
    }
  </script>
</body>
</html>
